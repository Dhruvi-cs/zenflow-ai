<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Ticket</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="assets/css/dashboard.css">
</head>

<body>

<div class="sidebar">

    <h2>AI Support</h2>

    <ul>
        <li><a href="dashboard.html"><i class="fa-solid fa-house"></i> Home</a></li>

        <li><a href="create-ticket.html"><i class="fa-solid fa-ticket"></i> Create Ticket</a></li>

        <li><a href="history.html"><i class="fa-solid fa-clock-rotate-left"></i> Ticket History</a></li>

        <li><a href="ai-chat.html"><i class="fa-solid fa-comments"></i> AI Chat</a></li>

        <li><a href="profile.html"><i class="fa-solid fa-user"></i> Profile</a></li>

        <li><a href="#"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
    </ul>

</div>

<div class="main-content">

    <div class="topbar">
        <h3>Create Support Ticket</h3>

        <div class="top-icons">
            <i class="fa-solid fa-bell"></i>
            <i class="fa-solid fa-user-circle"></i>
        </div>
    </div>

    <div class="ticket-form">

        <h2>Create New Ticket</h2>

        <div class="input-box">
            <label>Subject</label>
            <input type="text" placeholder="Enter ticket subject">
        </div>

        <div class="input-box">
            <label>Category</label>
            <select>
                <option>Technical Issue</option>
                <option>Account Issue</option>
                <option>Payment</option>
                <option>Bug Report</option>
                <option>Other</option>
            </select>
        </div>

        <div class="input-box">
            <label>Priority</label>
            <select>
                <option>Low</option>
                <option>Medium</option>
                <option>High</option>
            </select>
        </div>

        <div class="input-box">
            <label>Description</label>
            <textarea rows="6" placeholder="Describe your problem..."></textarea>
        </div>

        <div class="input-box">
            <label>Attachment</label>
            <input type="file">
        </div>

        <button class="submit-btn">
            <i class="fa-solid fa-paper-plane"></i>
            Submit Ticket
        </button>

    </div>

</div>
<!-- AI Response Modal / Container -->
  <div id="aiResponseContainer" style="display:none; margin: 20px auto; max-width: 600px; padding: 20px; border-radius: 8px; background: #eef2ff; border: 1px solid #c7d2fe;">
    <h3 style="color: #3730a3; margin-top: 0;">🤖 AI Suggested Solution</h3>
    <p id="aiAnswer" style="white-space: pre-line; color: #1e1b4b;"></p>
    <div style="margin-top: 15px;">
      <button id="resolveBtn" style="background: #16a34a; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; margin-right: 10px;">Mark Resolved (Deflect)</button>
      <button id="escalateBtn" style="background: #dc2626; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;">Escalate to Human Agent</button>
    </div>
  </div>

  <script>
    document.querySelector('.submit-btn').addEventListener('click', async (e) => {
      e.preventDefault();
      
      const subjectInput = document.querySelector('input[placeholder*="subject"]') || document.querySelectorAll('input[type="text"]')[0];
      const descriptionInput = document.querySelector('textarea');
      const submitBtn = document.querySelector('.submit-btn');

      const subject = subjectInput ? subjectInput.value.trim() : '';
      const description = descriptionInput ? descriptionInput.value.trim() : '';

      if (!description && !subject) {
        alert('Please provide a subject or description.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = 'Analyzing with AI...';

      try {
        const response = await fetch('http://localhost:5000/api/tickets', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            customerName: 'Dhruvi Shri',
            customerEmail: 'dhruvi@example.com',
            query: `${subject}: ${description}`.trim()
          })
        });

        const data = await response.json();

        if (response.ok) {
          const container = document.getElementById('aiResponseContainer');
          const answerP = document.getElementById('aiAnswer');
          
          answerP.textContent = data.aiData?.ai_response || data.ticket?.aiSolution || 'Ticket created successfully!';
          container.style.display = 'block';
          container.scrollIntoView({ behavior: 'smooth' });
        } else {
          alert('Error: ' + (data.message || 'Failed to submit ticket'));
        }
      } catch (err) {
        console.error(err);
        alert('Could not connect to backend server on port 5000.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Submit Ticket';
      }
    });
  </script>

</body>
</html>
