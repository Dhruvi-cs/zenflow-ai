<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
</head>

<body>

<div class="sidebar">
    <h2>AI Support</h2>
    <ul>
        <li><a href="dashboard.html"><i class="fa-solid fa-house"></i> Home</a></li>
        <li><a href="create-ticket.html"><i class="fa-solid fa-ticket"></i> Create Ticket</a></li>
        <li>
            <a href="history.html">
                <i class="fa-solid fa-clock-rotate-left"></i>
                Ticket History
            </a>
        </li>
        <li>
            <a href="ai-chat.html">
                <i class="fa-solid fa-comments"></i>
                AI Chat
            </a>
        </li>
        <li><a href="profile.html"><i class="fa-solid fa-user"></i> Profile</a></li>
        <li><a href="login.html"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
    </ul>
</div>

<div class="main-content">
    <div class="topbar">
        <h3>Customer Dashboard</h3>
        <div class="top-icons">
            <i class="fa-solid fa-bell"></i>
            <i class="fa-solid fa-user-circle"></i>
        </div>
    </div>

    <h2>Welcome Back 👋</h2>
    <div class="quick-actions">
        <button class="action-btn" onclick="window.location.href='create-ticket.html'">
            <i class="fa-solid fa-plus"></i>
            Create Ticket
        </button>
        <button class="action-btn" onclick="window.location.href='ai-chat.html'">
            <i class="fa-solid fa-comments"></i>
            AI Chat
        </button>
        <button class="action-btn" onclick="window.location.href='history.html'">
            <i class="fa-solid fa-clock-rotate-left"></i>
            Ticket History
        </button>
    </div>

    <div class="cards">
        <div class="card">
            <i class="fa-solid fa-ticket card-icon"></i>
            <h3>Total Tickets</h3>
            <h1 id="totalTickets">--</h1>
        </div>

        <div class="card">
            <i class="fa-solid fa-folder-open card-icon"></i>
            <h3>Open Tickets</h3>
            <h1 id="openTickets">--</h1>
        </div>

        <div class="card">
            <i class="fa-solid fa-circle-check card-icon"></i>
            <h3>Resolved</h3>
            <h1 id="resolvedTickets">--</h1>
        </div>

        <div class="card">
            <i class="fa-solid fa-hourglass-half card-icon"></i>
            <h3>Pending</h3>
            <h1 id="pendingTickets">--</h1>
        </div>
    </div>

    <div class="table-section">
        <h3>Recent Tickets</h3>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Subject</th>
                <th>Status</th>
                <th>Priority</th>
            </tr>
        </thead>
        <tbody id="ticketsTableBody">
            <tr>
                <td colspan="4" style="text-align: center; color: #888;">Loading recent tickets...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    async function fetchDashboardData() {
        try {
            // 1. Fetch live metrics from ticketRoutes.js
            const metricsRes = await fetch('http://localhost:5000/api/tickets/dashboard');
            if (metricsRes.ok) {
                const resJson = await metricsRes.json();
                const stats = resJson.stats || resJson;

                const total = stats.total ?? 0;
                const open = stats.open ?? 0;
                const resolved = stats.resolved ?? 0;
                const pending = Math.max(0, total - (open + resolved));

                document.getElementById('totalTickets').textContent = total;
                document.getElementById('openTickets').textContent = open;
                document.getElementById('resolvedTickets').textContent = resolved;
                document.getElementById('pendingTickets').textContent = pending;
            }

            // 2. Fetch recent tickets for the table
            const ticketsRes = await fetch('http://localhost:5000/api/tickets');
            if (ticketsRes.ok) {
                const ticketsData = await ticketsRes.json();
                const tickets = ticketsData.data || ticketsData.tickets || (Array.isArray(ticketsData) ? ticketsData : []);
                const tbody = document.getElementById('ticketsTableBody');

                if (tickets.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No tickets found.</td></tr>';
                    return;
                }

                // Render latest tickets (up to 5)
                tbody.innerHTML = tickets.slice(0, 5).map(t => {
                    const idString = (t._id || t.id || '---').toString().slice(-4).toUpperCase();
                    const ticketTitle = t.title || t.query || t.subject || 'Support Ticket';
                    const statusClass = t.status === 'Resolved' ? 'bg-success' : (t.status === 'Pending' ? 'bg-warning' : 'bg-primary');
                    
                    return `
                        <tr>
                            <td>#${idString}</td>
                            <td>${ticketTitle}</td>
                            <td><span class="badge ${statusClass}">${t.status || 'Open'}</span></td>
                            <td>${t.priority || 'Medium'}</td>
                        </tr>
                    `;
                }).join('');
            }
        } catch (err) {
            console.error('Error fetching dashboard data:', err);
        }
    }

    window.addEventListener('DOMContentLoaded', fetchDashboardData);
</script>

</body>
</html>
