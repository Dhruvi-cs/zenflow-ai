<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - AI Support</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
</head>

<body>

<div class="sidebar">
    <h2>AI Support</h2>
    <ul>
        <li><a href="dashboard.html"><i class="fa-solid fa-house"></i> Home</a></li>
        <li><a href="create-ticket.html"><i class="fa-solid fa-ticket"></i> Create Ticket</a></li>
        <li><a href="history.html"><i class="fa-solid fa-clock-rotate-left"></i> Ticket History</a></li>
        <li><a href="ai-chat.html"><i class="fa-solid fa-comments"></i> AI Chat</a></li>
        <li class="active"><a href="profile.html"><i class="fa-solid fa-user"></i> Profile</a></li>
        <li><a href="index.html"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
    </ul>
</div>

<div class="main-content">
    <div class="topbar">
        <h3>My Profile</h3>
        <div class="top-icons">
            <i class="fa-solid fa-bell"></i>
            <i class="fa-solid fa-user-circle"></i>
        </div>
    </div>

    <div class="profile-card">
        <div class="profile-image">
            <i class="fa-solid fa-user"></i>
        </div>

        <h2 id="displayUserName">John Doe</h2>
        <p id="displayUserRole">Customer</p>

        <form class="profile-form" id="profileForm" onsubmit="handleProfileUpdate(event)">
            <div class="input-box">
                <label>Full Name</label>
                <input type="text" id="fullNameInput" required placeholder="Enter your full name">
            </div>

            <div class="input-box">
                <label>Email Address</label>
                <input type="email" id="emailInput" required placeholder="name@example.com">
            </div>

            <div class="input-box">
                <label>Phone Number</label>
                <input type="text" id="phoneInput" placeholder="+91 9876543210">
            </div>

            <div class="input-box">
                <label>Address</label>
                <textarea id="addressInput" rows="3" placeholder="Enter your city/address"></textarea>
            </div>

            <button type="submit" class="submit-btn">
                <i class="fa-solid fa-floppy-disk"></i>
                Update Profile
            </button>
        </form>
    </div>
</div>

<script>
    // Load saved user info from localStorage or set defaults
    function loadProfile() {
        const savedName = localStorage.getItem("zenflow_user") || "John Doe";
        const savedEmail = localStorage.getItem("zenflow_email") || "john@example.com";
        const savedPhone = localStorage.getItem("zenflow_phone") || "+91 9876543210";
        const savedAddress = localStorage.getItem("zenflow_address") || "Kanpur, Uttar Pradesh";

        // Fill form fields
        document.getElementById("fullNameInput").value = savedName;
        document.getElementById("emailInput").value = savedEmail;
        document.getElementById("phoneInput").value = savedPhone;
        document.getElementById("addressInput").value = savedAddress;

        // Fill visual header card
        document.getElementById("displayUserName").textContent = savedName;
    }

    // Save profile updates to storage
    function handleProfileUpdate(event) {
        event.preventDefault();

        const name = document.getElementById("fullNameInput").value.trim();
        const email = document.getElementById("emailInput").value.trim();
        const phone = document.getElementById("phoneInput").value.trim();
        const address = document.getElementById("addressInput").value.trim();

        // Save persistent values for tickets & socket chat
        localStorage.setItem("zenflow_user", name);
        localStorage.setItem("zenflow_email", email);
        localStorage.setItem("zenflow_phone", phone);
        localStorage.setItem("zenflow_address", address);
        
        // Sync active chat session username
        sessionStorage.setItem("chat_username", name);

        // Update UI
        document.getElementById("displayUserName").textContent = name;

        alert("Profile updated successfully! Name synced to Chat & Tickets.");
    }

    window.addEventListener("DOMContentLoaded", loadProfile);
</script>

</body>
</html>
