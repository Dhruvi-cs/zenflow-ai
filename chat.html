<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZenFlow AI - Ticket Chat</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .chat-container {
      width: 100%;
      max-width: 500px;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      height: 85vh;
    }
    .chat-header {
      padding: 15px;
      background: #007bff;
      color: #fff;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chat-header h2 { margin: 0; font-size: 1.15rem; }
    .chat-header p { margin: 4px 0 0; font-size: 0.8rem; opacity: 0.9; }
    .back-btn {
      color: #fff;
      text-decoration: none;
      font-size: 0.85rem;
      background: rgba(255, 255, 255, 0.2);
      padding: 6px 12px;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .back-btn:hover { background: rgba(255, 255, 255, 0.35); }
    .chat-messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
    }
    .message.received {
      background: #e9ecef;
      align-self: flex-start;
      color: #333;
    }
    .message.sent {
      background: #007bff;
      color: white;
      align-self: flex-end;
    }
    .sender-name {
      font-size: 0.75rem;
      font-weight: bold;
      margin-bottom: 3px;
      display: block;
    }
    .chat-input-area {
      display: flex;
      padding: 12px;
      border-top: 1px solid #ddd;
    }
    .chat-input-area input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
    }
    .chat-input-area button {
      margin-left: 10px;
      padding: 10px 18px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .chat-input-area button:hover { background: #0056b3; }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <div>
        <h2 id="ticket-header-title">Ticket Discussion</h2>
        <p id="status-text">Status: Connecting...</p>
      </div>
      <a href="dashboard.html" class="back-btn">Dashboard</a>
    </div>

    <div class="chat-messages" id="messages-container"></div>

    <form class="chat-input-area" onsubmit="sendMessage(event)">
      <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>

  <!-- Socket.io Client Library -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <script>
    // 1. Extract dynamic ticketId from URL: chat.html?ticketId=...
    const urlParams = new URLSearchParams(window.location.search);
    const rawTicketId = urlParams.get("ticketId") || "general_support";
    const currentTicketId = "ticket_" + rawTicketId;
    
    // Generate a random username or pull from storage
    const username = "User_" + Math.floor(Math.random() * 1000);

    // Update Header with clean short ID
    const shortId = rawTicketId.length > 8 ? rawTicketId.slice(-4).toUpperCase() : rawTicketId;
    document.getElementById("ticket-header-title").innerText = `Ticket #${shortId} Live Chat`;

    const messagesContainer = document.getElementById("messages-container");
    const statusText = document.getElementById("status-text");
    const messageInput = document.getElementById("message-input");

    // 2. Connect to backend server
    const socket = io("http://localhost:5000");

    // 3. On Connection -> Join Dedicated Room
    socket.on("connect", () => {
      statusText.innerText = `Status: Connected as ${username}`;
      socket.emit("join_ticket", currentTicketId);
    });

    // On Disconnect
    socket.on("disconnect", () => {
      statusText.innerText = "Status: Disconnected";
    });

    // 4. Listen for incoming Live Messages for this ticket
    socket.on("receive_message", (data) => {
      displayMessage(data);
    });

    // 5. Send message to current ticket room
    function sendMessage(e) {
      if (e) e.preventDefault();

      const text = messageInput.value.trim();
      if (!text) return;

      const payload = {
        ticketId: currentTicketId,
        sender: username,
        message: text,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      socket.emit("send_message", payload);
      messageInput.value = "";
    }

    // 6. Append message bubble to chat window
    function displayMessage(data) {
      const isSelf = data.sender === username;
      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${isSelf ? "sent" : "received"}`;
      
      msgDiv.innerHTML = `
        <span class="sender-name">${isSelf ? "You" : data.sender}</span>
        <div>${data.message}</div>
      `;

      messagesContainer.appendChild(msgDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
  </script>
</body>
</html>
