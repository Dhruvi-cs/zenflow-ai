<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f8fafc;
      margin: 0;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    .sidebar {
      width: 260px;
      background-color: #1e3a8a;
      color: #fff;
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
    }
    .sidebar h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 2rem;
      padding-left: 12px;
    }
    .sidebar a {
      color: #cbd5e1;
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .sidebar a:hover, .sidebar a.active {
      background-color: #2563eb;
      color: #ffffff;
    }
    .sidebar .logout {
      margin-top: auto;
    }
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      height: 100vh;
    }
    .chat-header {
      padding: 20px 30px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .chat-header h4 {
      margin: 0;
      font-weight: 600;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .user-message {
      align-self: flex-end;
      background-color: #2563eb;
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 16px 16px 4px 16px;
      max-width: 70%;
      word-wrap: break-word;
      font-size: 0.95rem;
    }
    .bot-message {
      align-self: flex-start;
      background-color: #f1f5f9;
      color: #1e293b;
      padding: 14px 20px;
      border-radius: 16px 16px 16px 4px;
      max-width: 75%;
      word-wrap: break-word;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .typing-indicator {
      align-self: flex-start;
      background-color: #f1f5f9;
      color: #64748b;
      padding: 10px 18px;
      border-radius: 14px;
      font-size: 0.85rem;
      font-style: italic;
    }
    .quick-tags {
      padding: 10px 30px;
      display: flex;
      gap: 10px;
    }
    .quick-tag {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.85rem;
      color: #475569;
      cursor: pointer;
      transition: background 0.2s;
    }
    .quick-tag:hover {
      background: #e2e8f0;
    }
    .chat-footer {
      padding: 20px 30px;
      border-top: 1px solid #e2e8f0;
      background: #ffffff;
    }
    .input-group {
      display: flex;
      gap: 12px;
    }
    .input-group input {
      flex: 1;
      padding: 12px 20px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      outline: none;
      font-size: 0.95rem;
    }
    .input-group input:focus {
      border-color: #2563eb;
    }
    .input-group button {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 0 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .input-group button:hover {
      background-color: #1d4ed8;
    }
    .input-group button:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>AI Support</h2>
    <a href="dashboard.html"><i class="fa-solid fa-house"></i> Home</a>
    <a href="create-ticket.html"><i class="fa-solid fa-ticket"></i> Create Ticket</a>
    <a href="history.html"><i class="fa-solid fa-clock-rotate-left"></i> Ticket History</a>
    <a href="ai-chat.html" class="active"><i class="fa-solid fa-comment-dots"></i> AI Chat</a>
    <a href="profile.html"><i class="fa-solid fa-user"></i> Profile</a>
    <a href="index.html" class="logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="chat-header">
      <h4><i class="fa-solid fa-robot text-primary"></i> AI Support Assistant</h4>
    </div>

    <!-- Chat Messages Container -->
    <div class="chat-body" id="chatBody">
      <div class="bot-message">
        👋 Hello! Welcome to AI Support. How can I assist you today?
      </div>
    </div>

    <!-- Quick Prompt Tags -->
    <div class="quick-tags">
      <span class="quick-tag" onclick="sendQuickMessage('Ticket History')">📋 Ticket History</span>
      <span class="quick-tag" onclick="sendQuickMessage('Ticket Status')">🔍 Ticket Status</span>
      <span class="quick-tag" onclick="sendQuickMessage('how to reset my password?')">🔑 Reset Password</span>
    </div>

    <!-- Chat Input Form -->
    <div class="chat-footer">
      <form id="chatForm" onsubmit="handleChatSubmit(event)">
        <div class="input-group">
          <input type="text" id="userInput" placeholder="Type your message..." autocomplete="off" required>
          <button type="submit" id="sendBtn">
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const chatBody = document.getElementById('chatBody');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    function sendQuickMessage(text) {
      userInput.value = text;
      sendMessage(text);
    }

    function handleChatSubmit(event) {
      event.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;
      sendMessage(text);
    }

    async function sendMessage(text) {
      // 1. Render User Message
      chatBody.innerHTML += `<div class="user-message">${text}</div>`;
      userInput.value = '';
      userInput.disabled = true;
      sendBtn.disabled = true;

      // 2. Render Temporary Typing Indicator
      const typingId = 'typing-' + Date.now();
      chatBody.innerHTML += `<div class="typing-indicator" id="${typingId}">AI is thinking...</div>`;
      chatBody.scrollTop = chatBody.scrollHeight;

      try {
        // 3. Post to Node Backend AI Chat Proxy (Port 5000)
        const response = await fetch('http://localhost:5000/api/ai/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ message: text, query: text })
        });

        const data = await response.json();

        // Remove typing indicator
        document.getElementById(typingId)?.remove();

        // 4. Safely extract any returned AI response key
        const aiReply = data.reply || data.answer || data.response || data.message || "I have received your request.";

        // Render AI Message
        chatBody.innerHTML += `<div class="bot-message">${aiReply}</div>`;
      } catch (error) {
        console.error("AI Request Failed:", error);
        document.getElementById(typingId)?.remove();
        
        chatBody.innerHTML += `<div class="bot-message text-danger">⚠️ Unable to reach the server. Please check that port 5000 is active.</div>`;
      } finally {
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
        chatBody.scrollTop = chatBody.scrollHeight;
      }
    }
  </script>
</body>
</html>
