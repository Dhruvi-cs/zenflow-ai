<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">

    <style>
        /* Quick Suggestion Chips */
        .chat-suggestions {
            display: flex;
            gap: 8px;
            padding: 10px 15px 0 15px;
            flex-wrap: wrap;
        }
        .suggestion-chip {
            background-color: #eef2f5;
            color: #495057;
            border: 1px solid #ced4da;
            border-radius: 16px;
            padding: 4px 12px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .suggestion-chip:hover {
            background-color: #0d6efd;
            color: #ffffff;
            border-color: #0d6efd;
        }

        /* Typing Indicator Dots */
        .typing-indicator span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #6c757d;
            border-radius: 50%;
            margin-right: 3px;
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: 0s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>

<body>

<div class="sidebar">
    <h2>AI Support</h2>
    <ul>
        <li><a href="dashboard.html"><i class="fa-solid fa-house"></i> Home</a></li>
        <li><a href="create-ticket.html"><i class="fa-solid fa-ticket"></i> Create Ticket</a></li>
        <li><a href="history.html"><i class="fa-solid fa-clock-rotate-left"></i> Ticket History</a></li>
        <li><a href="ai-chat.html"><i class="fa-solid fa-comments"></i> AI Chat</a></li>
        <li><a href="profile.html"><i class="fa-solid fa-user"></i> Profile</a></li>
        <li><a href="#"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
    </ul>
</div>

<div class="main-content">
    <div class="topbar">
        <h3>AI Support Chat</h3>
        <div class="top-icons">
            <button onclick="clearChatHistory()" class="btn btn-sm btn-outline-secondary me-3">
                <i class="fa-solid fa-trash"></i> Clear Chat
            </button>
            <i class="fa-solid fa-bell"></i>
            <i class="fa-solid fa-user-circle"></i>
        </div>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            🤖 AI Support Assistant
        </div>

        <div class="chat-body" id="chatBody">
            <!-- Messages load dynamically from localStorage or default welcome message -->
        </div>

        <!-- Quick Prompt Chips -->
        <div class="chat-suggestions">
            <button class="suggestion-chip" onclick="sendQuickPrompt('How to check my ticket history?')">📋 Ticket History</button>
            <button class="suggestion-chip" onclick="sendQuickPrompt('How to check ticket status?')">🔍 Ticket Status</button>
            <button class="suggestion-chip" onclick="sendQuickPrompt('How do I reset password?')">🔑 Reset Password</button>
        </div>

        <div class="chat-input">
            <input type="text" id="message" placeholder="Type your message...">
            <button id="sendBtn" onclick="sendMessage()">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>
</div>

<script>
    const chatBody = document.getElementById("chatBody");
    const STORAGE_KEY = "zenflow_chat_history";

    // 1. Load Chat History from LocalStorage on Page Load
    document.addEventListener("DOMContentLoaded", () => {
        const savedChat = localStorage.getItem(STORAGE_KEY);
        if (savedChat) {
            chatBody.innerHTML = savedChat;
        } else {
            chatBody.innerHTML = `
                <div class="bot-message">
                    👋 Hello! Welcome to AI Support. How can I help you today?
                </div>
            `;
            saveChatHistory();
        }
        chatBody.scrollTop = chatBody.scrollHeight;
    });

    function saveChatHistory() {
        // Exclude temporary typing indicators when saving
        const clone = chatBody.cloneNode(true);
        const typingElem = clone.querySelector("#typingIndicator");
        if (typingElem) typingElem.remove();
        localStorage.setItem(STORAGE_KEY, clone.innerHTML);
    }

    function clearChatHistory() {
        localStorage.removeItem(STORAGE_KEY);
        chatBody.innerHTML = `
            <div class="bot-message">
                👋 Hello! Welcome to AI Support. How can I help you today?
            </div>
        `;
        saveChatHistory();
    }

    function sendQuickPrompt(promptText) {
        document.getElementById("message").value = promptText;
        sendMessage();
    }

    async function sendMessage() {
        let input = document.getElementById("message");
        let btn = document.getElementById("sendBtn");
        let text = input.value.trim();

        if (text === "") return;

        // Add user message to UI
        chatBody.innerHTML += `<div class="user-message">${text}</div>`;
        input.value = "";
        
        // Add Typing Indicator Bubble
        const typingId = "typingIndicator";
        chatBody.innerHTML += `
            <div class="bot-message" id="${typingId}">
                🤖 <span class="typing-indicator"><span></span><span></span><span></span></span>
            </div>
        `;
        
        chatBody.scrollTop = chatBody.scrollHeight;

        input.disabled = true;
        btn.disabled = true;

        try {
            const response = await fetch('http://localhost:5000/api/ai/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });

            const data = await response.json();

            // Remove typing indicator before adding response
            document.getElementById(typingId)?.remove();

            chatBody.innerHTML += `
                <div class="bot-message">${data.reply || "AI Assistant: No response received."}</div>
            `;
        } catch (error) {
            console.error("AI Request Failed:", error);
            
            document.getElementById(typingId)?.remove();
            
            chatBody.innerHTML += `
                <div class="bot-message">
                    ⚠️ Network Error: Unable to reach the server. Make sure your Node backend is running.
                </div>
            `;
        } finally {
            input.disabled = false;
            btn.disabled = false;
            input.focus();
            
            saveChatHistory(); // Save updated chat to browser
            chatBody.scrollTop = chatBody.scrollHeight;
        }
    }

    document.getElementById("message").addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
            sendMessage();
        }
    });
</script>
<script src="assets/js/script.js"></script>
</body>

</html>
